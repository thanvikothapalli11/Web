<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input type</title>
</head>
<body>
    <input type="password" placeholder="Enter password"> <br>
    <input type="time" placeholder="Enter time"> <br>
    <input type="url" placeholder="Enter url"><br>
    <input type="email" placeholder="Enter Email"><br>
    <input type="number" placeholder="Enter number"><br>
    <input type="date" placeholder="Enter Date"><br>
    <input type="month" placeholder="Enter month"><br>
    <input type="week" placeholder="Enter week"><br>
    <input type="date time-local" placeholder="Enter date time-local"><br>
    <input type="color" placeholder="Enter color"><br>
    <input type="tel" placeholder="Enter tel"><br>
    <input type="search" placeholder="Enter search"><br>
    <input type="file" placeholder="Enter file"><br>
    <input type="range" placeholder="Enter range"><br>
    <input type="radio" placeholder="Enter radio"><br>
    <input type="checkbox" placeholder="Enter checkbox"><br>
    <input type="submit" placeholder="Enter submit"><br>
    <input type="reset" placeholder="Enter reset"><br>
    <input type="button" placeholder="Enter button"><br>
    <input type="hidden" placeholder="Enter hidden"><br>
</body>
</html>
