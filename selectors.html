<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <style>
        p {
            color: rgb(86, 205, 221);
        }
        .THANVI {
            color: deeppink;
            background-color: lightskyblue;
        }
        #ASHA {
            color: greenyellow;
            font-size: 25px;
        }
    </style>
</head>
<body>
    <h1>CSS selectors</h1>
    <p>This is paragraph</p>
    <p>This ia paragraph</p>
    <p class="THANVI">This is highlighted text</p>
    <h2 class="THANVI">This heading also uses the class.</h2>
    <p id="ASHA">This is special text</p>
</body>
</html>
