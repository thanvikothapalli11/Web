<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task Borders</title>
    <style>
        h1{
            border:3px solid rgb(224, 19, 193) ;
            border-radius: 15px;
            color: gb(60, 27, 253);
        }
        .profile {
            border: 3px solid greenyellow;
            padding: 15px;
            border-radius: 15px;
        }
        .skills{
            border: 3px dashed orange;
            padding: 15px;
            border-radius: 15px;
        }
        h2 {
            border: 2px dotted rgb(90, 147, 228);
            border-radius: 15px;
            color: deeppink;
        }
        ul {
                color: rgb(241, 122, 206);
                font-size: 18px;
            }
        ol {
            color: rgb(66, 43, 218);
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>My Self</h1>
    <div class="profile">
        <ol>
        <li>Music</li>
        <li>karate</li>
        <li>painting</li>
        <li>singing</li>
        </ol>
    </div>
    <div class="skills">
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JS</li>
        </ul>
    </div>
    <h2>Thank you</h2>
</body>
</html>
