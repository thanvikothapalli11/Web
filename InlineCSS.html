<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INLINE CSS</title>
</head>
<body>
    <h1 style="color:aqua; text-align: center;">
        My website
</h1>
<!--The style is applied directly to this paragraph-->
<p style="color:greenyellow; font-size: 20px ;">
    This is an example of inline css.
    </p>
<!--Another element with its own style-->
<button style="background-color: hotpink; color: antiquewhite;">
    click me </button>
</body>
</html>
