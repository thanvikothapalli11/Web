<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Borders</title>
    <style>
        h1 {
            color: aqua;
            font-size:20px;
        }
        p {
            color: rgb(59, 170, 214);
            font-size: 20px;
        }
        .box1 {
            border: 3px dashed slateblue;
            border-radius: 15px;
        }
        .box2 {
            border: 3px dotted chartreuse;
            border-radius: 15px;
        }
        .box3 {
            border: 3px double hotpink;
            border-radius:15px;
        }
        .box4 {
            border: 3px solid rgb(169, 221, 38);
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <h1>CSS borders</h1>
    <p>This paragraph has a solid border.</p>
    <p class="box1">vidya</p>
    <p class="box2">Thanu</p>
    <p class="box3">Roopa</p>
    <p class="box4">Tareesha</p>
</body>
</html>
